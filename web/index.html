<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="violation">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>violation</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (() => {
      let nextTextFieldId = 0;

      const addTextFieldIdentity = (node) => {
        if (!(node instanceof HTMLInputElement || node instanceof HTMLTextAreaElement)) {
          return;
        }

        if (!node.closest('flt-text-editing-host')) {
          return;
        }

        const label = node.getAttribute('aria-label')?.trim() || '';
        if (!node.id) {
          node.id = `flutter-text-field-${++nextTextFieldId}`;
        }
        if (!node.name) {
          node.name = label.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || node.id;
        }
      };

      const observer = new MutationObserver((mutations) => {
        for (const mutation of mutations) {
          for (const node of mutation.addedNodes) {
            if (node instanceof Element) {
              addTextFieldIdentity(node);
              node.querySelectorAll('input, textarea').forEach(addTextFieldIdentity);
            }
          }
        }
      });

      observer.observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
